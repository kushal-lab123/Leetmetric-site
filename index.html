<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Project · LeetMetric</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="mainContainer">
        <h1>Welcome To LeetMetric</h1>
        <div class="container">
            <div class="user">
                <p>Enter your username</p>
                <div class="input-group">
                    <input id="username" type="text" placeholder="enter your username here">
                    <button id="submit">submit</button>
                </div>
            </div>
            <div class="stats">
                <div class="circle">
                    <div class="box Easy" id="easyCircle">
                        <span>Easy</span>
                    </div>
                    <div class="box Medium" id="mediumCircle">
                        <span>Medium</span>
                    </div>
                    <div class="box Hard" id="hardCircle">
                        <span>Hard</span>
                    </div>
                </div>
                <div class="info">
                    <div class="solved" id="Easy">Easy</div>
                    <div class="solved" id="Medium">Medium</div>
                    <div class="solved" id="Hard">Hard</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
